spring:
  application:
    name: trace-meeting-notes
  datasource:
    # 실행 위치 기준 ./data/ 아래 파일 DB (data/는 .gitignore)
    url: jdbc:h2:file:./data/trace-notes
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션으로만 바꾼다
      ddl-auto: validate
  h2:
    console:
      enabled: false

app:
  # SPEC S3: 입력 최대 글자 수 (CRLF를 LF로 정규화한 뒤 코드 포인트 수)
  max-script-chars: 50000
  # SPEC S3: 요청 본문 바이트 상한 200KB (200 × 1024)
  max-request-bytes: 204800
  # 프론트 주소만 허용한다. "*"는 쓰지 않는다.
  cors-allowed-origins:
    - http://localhost:5173
