spring:
  application:
    name: trace-meeting-notes
  datasource:
    # 실행 위치 기준 ./data/ 아래 파일 DB (data/는 .gitignore)
    # TRACE_LEVEL_FILE=0: H2가 SQL 오류와 실패한 값(본문)을 trace.db 파일에 남기지 않게 한다 (ADR 0005)
    url: jdbc:h2:file:./data/trace-notes;TRACE_LEVEL_FILE=0
    username: sa
    password: ""
  h2:
    console:
      enabled: false

logging:
  level:
    # DispatcherServlet은 DEBUG에서 요청 URI를 남긴다. URI 속 작업 ID가 곧 열람 권한이라
    # org.springframework.web을 DEBUG로 켜도 이 로거는 INFO로 둔다 (SPEC F2 알려진 한계)
    org.springframework.web.servlet.DispatcherServlet: INFO

app:
  # SPEC S3: 입력 최대 글자 수 (CRLF를 LF로 정규화한 뒤 코드 포인트 수)
  max-script-chars: 50000
  # SPEC S3: 요청 본문 바이트 상한 200KB (200 × 1024)
  max-request-bytes: 204800
  rate-limit:
    # SPEC F1: 미리보기 API IP당 분당 요청 수. 정리 요청 제한(S4)과 별도
    preview-per-minute: 60
    # SPEC S4: 작업 생성 IP당 시간당 요청 수 (개발 프로필 200, application-dev.yml)
    job-per-hour: 20
    # SPEC F2: 작업 조회 IP당 분당 요청 수 (화면이 2초마다 조회). 미리보기·작업 생성과 별도
    status-per-minute: 120
  # SPEC S2: 작업·발언 보관 기간과 삭제 실행 간격
  retention: 24h
  retention-cleanup-interval: 10m
  # SPEC F2: LLM 호출 (ADR 0002). 키는 환경 변수 LLM_API_KEY로만 넣는다
  llm:
    # .env와 셸 환경 변수 둘 다 적용되도록 APP_LLM_* 이름으로 참조하고 기본값을 둔다
    provider: ${APP_LLM_PROVIDER:openai-compatible}
    # llama-server는 127.0.0.1:8081에서만 연다 (백엔드가 8080)
    base-url: ${APP_LLM_BASE_URL:http://127.0.0.1:8081/v1}
    model: ${APP_LLM_MODEL:qwen3-8b}
    api-key: ${LLM_API_KEY:}
    timeout: 5m
    # 실행기에 연결하는 타임아웃. 넘으면 연결 실패(재시도 없음)
    connect-timeout: 10s
    # Qwen3 생각 모드 끄기 (chat_template_kwargs.enable_thinking=false). Kanana는 false
    disable-thinking: true
    # 정리 작업이라 샘플링을 낮은 temperature와 고정 seed로 둔다 (ADR 0002). seed는 0 이상(-1 무작위는 받지 않음)
    temperature: 0.2
    seed: 42
  # SPEC F2: 정리 프롬프트 버전 (prompts/summarize.{버전}.md). 바꾸기 전에 /eval로 비교한다
  summary:
    prompt-version: v2
    # 덩어리 최대 글자 수 (요청 줄 "[번호] 화자: 내용" 기준). eval·노트북 실측으로 조정
    chunk-size: 6000
    # ADR 0007: 동시에 실행하는 정리 작업 수와 기다리는(QUEUED) 작업 상한. 넘으면 429 QUEUE_FULL
    workers: 1
    queue-capacity: 10
  # 프론트 주소만 허용한다. "*"는 쓰지 않는다.
  cors-allowed-origins:
    - http://localhost:5173

---
# 실행 시 저장소 루트의 .env(KEY=VALUE)를 설정으로 읽는다 (backend/에서 실행 기준). 없으면 건너뛴다.
# 테스트 프로필에서는 읽지 않는다: 자동 테스트가 실제 비밀값에 닿지 않게 한다 (rules/testing.md)
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:file:../.env[.properties]
